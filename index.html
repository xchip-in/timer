<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            background: #000;
            color: #00ff00;
            overflow: hidden;
            cursor: default; /* Changed from none to make it usable */
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            text-align: center;
            padding: 1rem;
        }

        .timer-display {
            font-size: clamp(3rem, 12vw, 15rem); /* Reduced from 20vw to 12vw to fit the longer MM:SS.ms format */
            font-weight: 900; /* Increased from bold to 900 for maximum boldness */
            line-height: 1;
            letter-spacing: 0.05em; /* Slightly reduced letter spacing for the longer string */
            margin-right: -0.05em;
            text-shadow: 0 0 40px #00ff00;
            user-select: none;
        }

        /* Landscape Optimization for Mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .timer-display {
                font-size: clamp(2.5rem, 15vh, 10rem);
            }
            .controls {
                margin-top: 1rem;
                gap: 0.8rem;
            }
            .presets {
                margin-top: 1rem;
                gap: 0.5rem;
            }
            button {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
        }

        /* Small Phone Portrait Optimization */
        @media (max-width: 400px) {
            .timer-display {
                font-size: clamp(2.5rem, 14vw, 8rem); /* Reduced from 22vw to 14vw to fit the 8-character string */
            }
            .controls {
                margin-top: 2rem;
                gap: 1rem;
            }
            button {
                padding: 0.6rem 1.2rem;
                font-size: 1rem;
            }
        }

        .controls {
            margin-top: 3rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            max-width: 95vw;
        }

        .container:hover .controls,
        body.fullscreen .controls {
            opacity: 1;
        }

        button {
            background: #333;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 0.75rem 1.5rem;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        button:hover {
            background: #00ff00;
            color: #000;
        }

        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(51, 51, 51, 0.8);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        body:hover .fullscreen-btn {
            opacity: 1;
        }

        body.fullscreen .fullscreen-btn,
        body.fullscreen .controls,
        body.fullscreen .presets {
            opacity: 0 !important;
        }

        body.hide-controls .controls,
        body.hide-controls .presets,
        body.hide-controls .fullscreen-btn,
        body.hide-controls .session-counter,
        body.hide-controls .status {
            opacity: 0 !important;
        }

        .hide-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(51, 51, 51, 0.8);
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        body:hover .hide-btn {
            opacity: 1;
        }

        .presets {
            margin-top: 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            max-width: 90vw;
        }

        .container:hover .presets {
            opacity: 1;
        }

        .preset-btn {
            background: #002200;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 0.4rem 0.8rem;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s ease;
        }

        .preset-btn:hover {
            background: #004400;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
            <button id="setTimeBtn">Set Time</button>
        </div>
        <div class="presets">
            <button class="preset-btn" data-minutes="25">25min Study</button>
            <button class="preset-btn" data-minutes="5">5min Break</button>
            <button class="preset-btn" data-minutes="15">15min Break</button>
        </div>
    </div>
    <button class="fullscreen-btn" id="fullscreenBtn">Fullscreen</button>
    <button class="hide-btn" id="hideBtn">Hide</button>

    <script>
        let timerInterval;
        let totalMilliseconds = 0; // Default to 0
        let isRunning = false;
        let isCountdown = false; // Default to count up
        let lastTime = 0;
        let isBreakTime = false;

        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const setTimeBtn = document.getElementById('setTimeBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const hideBtn = document.getElementById('hideBtn');
        let controlsHidden = false;

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            const milliseconds = Math.floor((ms % 1000) / 10); // 2 digits for ms

            const msStr = milliseconds.toString().padStart(2, '0');
            const secStr = secs.toString().padStart(2, '0');
            const minStr = minutes.toString().padStart(2, '0');

            if (hours > 0) {
                return `${hours.toString().padStart(2, '0')}:${minStr}:${secStr}.${msStr}`;
            }
            return `${minStr}:${secStr}.${msStr}`;
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(totalMilliseconds);
        }

        function playAlarm() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            function beep(freq, startTime, duration) {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.setValueAtTime(freq, startTime);
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
            }

            // Play a triple beep alarm
            beep(880, audioContext.currentTime, 0.5);
            beep(880, audioContext.currentTime + 0.6, 0.5);
            beep(880, audioContext.currentTime + 1.2, 0.8);
        }

        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                lastTime = Date.now();
                timerInterval = setInterval(() => {
                    const now = Date.now();
                    const delta = now - lastTime;
                    lastTime = now;

                    if (isCountdown) {
                        totalMilliseconds -= delta;
                        if (totalMilliseconds <= 0) {
                            totalMilliseconds = 0;
                            pauseTimer();
                            playAlarm();

                            if (isBreakTime) {
                                isBreakTime = false;
                                totalMilliseconds = 25 * 60 * 1000;
                                isCountdown = true;
                                updateDisplay();
                            } else {
                                isBreakTime = true;
                                totalMilliseconds = 5 * 60 * 1000;
                                updateDisplay();
                                setTimeout(() => startTimer(), 2000);
                            }
                        }
                    } else {
                        totalMilliseconds += delta;
                    }
                    updateDisplay();
                }, 16); // Roughly 60fps update rate
            }
        }

        function pauseTimer() {
            if (isRunning) {
                isRunning = false;
                clearInterval(timerInterval);
            }
        }

        function resetTimer() {
            pauseTimer();
            totalMilliseconds = 0;
            isCountdown = false;
            updateDisplay();
        }

        function setTime() {
            const minutes = prompt('Enter study time in minutes:', '25');
            if (minutes && !isNaN(minutes) && minutes > 0) {
                pauseTimer();
                totalMilliseconds = parseInt(minutes) * 60 * 1000;
                isCountdown = true;
                updateDisplay();
                startTimer(); // Auto-start after setting time
            }
        }

        function toggleFullscreen() {
            const doc = window.document;
            const docEl = doc.documentElement;

            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

            if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                if (requestFullScreen) requestFullScreen.call(docEl);
                document.body.classList.add('fullscreen');
            } else {
                if (cancelFullScreen) cancelFullScreen.call(doc);
                document.body.classList.remove('fullscreen');
            }
        }

        function toggleHideControls() {
            controlsHidden = !controlsHidden;
            if (controlsHidden) {
                document.body.classList.add('hide-controls');
                hideBtn.textContent = 'Show';
            } else {
                document.body.classList.remove('hide-controls');
                hideBtn.textContent = 'Hide';
            }
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        setTimeBtn.addEventListener('click', setTime);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        hideBtn.addEventListener('click', toggleHideControls);

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                pauseTimer();
                const minutes = parseInt(btn.dataset.minutes);
                totalMilliseconds = minutes * 60 * 1000;
                isCountdown = true;
                updateDisplay();
                startTimer(); // Auto-start when preset selected
            });
        });

        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    isRunning ? pauseTimer() : startTimer();
                    break;
                case 'KeyR':
                    resetTimer();
                    break;
                case 'KeyF':
                case 'F11':
                    toggleFullscreen();
                    break;
                case 'KeyS':
                    setTime();
                    break;
                case 'KeyH':
                    toggleHideControls();
                    break;
            }
        });

        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(eventName => {
            document.addEventListener(eventName, () => {
                const doc = window.document;
                if (doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement) {
                    document.body.classList.add('fullscreen');
                } else {
                    document.body.classList.remove('fullscreen');
                }
            });
        });

        updateDisplay();
    </script>
</body>
</html>
