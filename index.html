<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', monospace;
            background: #000;
            color: #00ff00;
            overflow: hidden;
            cursor: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .timer-display {
            font-size: 25vw;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-shadow: 0 0 50px #00ff00;
            user-select: none;
        }

        .controls {
            margin-top: 2vh;
            display: flex;
            gap: 2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .container:hover .controls,
        body.fullscreen .controls {
            opacity: 1;
        }

        button {
            background: #333;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #00ff00;
            color: #000;
        }

        .status {
            margin-top: 1vh;
            font-size: 3rem;
            opacity: 0.7;
        }

        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(51, 51, 51, 0.8);
            padding: 0.5rem 1rem;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body:hover .fullscreen-btn {
            opacity: 1;
        }

        body.fullscreen .fullscreen-btn,
        body.fullscreen .controls,
        body.fullscreen .presets {
            opacity: 0 !important;
        }

        body.hide-controls .controls,
        body.hide-controls .presets,
        body.hide-controls .fullscreen-btn,
        body.hide-controls .session-counter,
        body.hide-controls .status {
            opacity: 0 !important;
        }

        .hide-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(51, 51, 51, 0.8);
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body:hover .hide-btn {
            opacity: 1;
        }

        .presets {
            margin-top: 1vh;
            display: flex;
            gap: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .container:hover .presets {
            opacity: 1;
        }

        .preset-btn {
            background: #002200;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .preset-btn:hover {
            background: #004400;
        }

        .session-counter {
            margin-top: 1vh;
            font-size: 2rem;
            opacity: 0.8;
        }

        .break-mode {
            background: #000044 !important;
            color: #4444ff !important;
        }

        .break-mode .timer-display {
            color: #4444ff !important;
            text-shadow: 0 0 50px #4444ff !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div class="status" id="status">Ready to start</div>
        <div class="session-counter" id="sessionCounter">Sessions: 0</div>
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
            <button id="setTimeBtn">Set Time</button>
        </div>
        <div class="presets">
            <button class="preset-btn" data-minutes="25">25min Study</button>
            <button class="preset-btn" data-minutes="5">5min Break</button>
            <button class="preset-btn" data-minutes="15">15min Break</button>
        </div>
    </div>
    <button class="fullscreen-btn" id="fullscreenBtn">Fullscreen</button>
    <button class="hide-btn" id="hideBtn">Hide</button>

    <script>
        let timerInterval;
        let totalSeconds = 0;
        let isRunning = false;
        let isCountdown = false;
        let initialTime = 0;
        let sessionCount = 0;
        let isBreakTime = false;

        const timerDisplay = document.getElementById('timerDisplay');
        const status = document.getElementById('status');
        const sessionCounter = document.getElementById('sessionCounter');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const setTimeBtn = document.getElementById('setTimeBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const hideBtn = document.getElementById('hideBtn');
        let controlsHidden = false;

        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;

            if (hours > 0) {
                return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(totalSeconds);
        }

        function playBeep() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 1);
        }

        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                status.textContent = isCountdown ? 'Countdown Running' : 'Running';
                timerInterval = setInterval(() => {
                    if (isCountdown) {
                        totalSeconds--;
                        if (totalSeconds <= 0) {
                            totalSeconds = 0;
                            pauseTimer();
                            playBeep();

                            if (isBreakTime) {
                                status.textContent = 'Break over! Back to study';
                                document.body.classList.remove('break-mode');
                                isBreakTime = false;
                            } else {
                                sessionCount++;
                                sessionCounter.textContent = `Sessions: ${sessionCount}`;
                                status.textContent = 'Study session complete! Take a break';
                                document.body.classList.add('break-mode');
                                isBreakTime = true;
                                totalSeconds = 5 * 60;
                                updateDisplay();
                                setTimeout(() => startTimer(), 2000);
                            }
                        }
                    } else {
                        totalSeconds++;
                    }
                    updateDisplay();
                }, 1000);
            }
        }

        function pauseTimer() {
            if (isRunning) {
                isRunning = false;
                status.textContent = 'Paused';
                clearInterval(timerInterval);
            }
        }

        function resetTimer() {
            isRunning = false;
            totalSeconds = 0;
            status.textContent = 'Ready to start';
            clearInterval(timerInterval);
            updateDisplay();
        }

        function setTime() {
            const minutes = prompt('Enter study time in minutes:', '25');
            if (minutes && !isNaN(minutes) && minutes > 0) {
                totalSeconds = parseInt(minutes) * 60;
                status.textContent = `Set to ${minutes} minutes`;
                updateDisplay();
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.body.classList.add('fullscreen');
            } else {
                document.exitFullscreen();
                document.body.classList.remove('fullscreen');
            }
        }

        function toggleHideControls() {
            controlsHidden = !controlsHidden;
            if (controlsHidden) {
                document.body.classList.add('hide-controls');
                hideBtn.textContent = 'Show';
            } else {
                document.body.classList.remove('hide-controls');
                hideBtn.textContent = 'Hide';
            }
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        setTimeBtn.addEventListener('click', setTime);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        hideBtn.addEventListener('click', toggleHideControls);

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const minutes = parseInt(btn.dataset.minutes);
                totalSeconds = minutes * 60;
                initialTime = totalSeconds;
                isCountdown = true;
                status.textContent = `Set to ${minutes} minutes (countdown)`;
                updateDisplay();
                if (isRunning) {
                    pauseTimer();
                }
            });
        });

        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    isRunning ? pauseTimer() : startTimer();
                    break;
                case 'KeyR':
                    resetTimer();
                    break;
                case 'KeyF':
                case 'F11':
                    toggleFullscreen();
                    break;
                case 'KeyS':
                    setTime();
                    break;
                case 'KeyH':
                    toggleHideControls();
                    break;
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                document.body.classList.add('fullscreen');
            } else {
                document.body.classList.remove('fullscreen');
            }
        });

        updateDisplay();
    </script>
</body>
</html>
